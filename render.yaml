# Render Blueprint: tek web servisi hem API'yi (/api) hem derlenmiş React sitesini sunar.
# Render panelinde: New + > Blueprint > bu depoyu seçin.
services:
  - type: web
    name: aura-perfume
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Oturum imza anahtarı Render tarafından rastgele üretilir (depoda saklanmaz)
      - key: JWT_SECRET
        generateValue: true
